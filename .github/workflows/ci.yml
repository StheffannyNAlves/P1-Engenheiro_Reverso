# Progressão por fase:
#   Fase 1: build + clang-format + tamanho do binário
#   Fase 2: mesmos checks (nenhuma alteração necessária no workflow)
#   Fase 3: descomentar o job python-tests
#   Fase 4: descomentar o job release

name: Dolos CI

on:
  push:
    branches:
      - main
      - 'fase*'
  pull_request:
    branches:
      - main

# FASE 1 — Ativo desde o início

jobs:

  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/lib/pico-sdk

    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar toolchain ARM + CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            ninja-build

      - name: Configurar CMake
        run: cmake -B build -G Ninja

      - name: Compilar
        run: cmake --build build --parallel

      - name: Verificar tamanho do binário
        run: |
          arm-none-eabi-size build/dolos.elf
          # Falha se o binário ultrapassar 1.8 MB (deixa margem na flash de 2 MB)
          BINARY_SIZE=$(arm-none-eabi-size build/dolos.elf | awk 'NR==2 {print $4}')
          MAX_SIZE=1887436  # 1.8 MB em bytes
          if [ "$BINARY_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERRO: binário ($BINARY_SIZE bytes) ultrapassa o limite de 1.8 MB"
            exit 1
          fi
          echo "Tamanho OK: $BINARY_SIZE bytes"

      - name: Upload do artefato .uf2
        uses: actions/upload-artifact@v4
        with:
          name: dolos-firmware
          path: build/dolos.uf2
          retention-days: 7


  lint:
    name: Lint C (clang-format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar clang-format
        run: sudo apt-get install -y clang-format

      - name: Verificar formatação
        run: |
          FILES=$(git ls-files '*.c' '*.h' \
            ':!:src/transport/usb_descriptors.c')

          if [ -z "$FILES" ]; then
             echo "Nenhum arquivo C encontrado — pulando lint"
             exit 0
          fi

          echo "$FILES" | xargs clang-format --dry-run --Werror
          echo "Formatação OK"


